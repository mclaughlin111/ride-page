# Builds the production image on every push to main, publishes it to GitHub
# Container Registry and tells the server to pull and restart it. Pull
# requests only run lint and tests.
#
# One-off setup (see DEPLOYMENT.md, "Continuous deployment"):
#   repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
#   repository variable (optional): DEPLOY_PATH, default /root/ride-board
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy compose file
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/ride-board' }}
        run: scp -i ~/.ssh/deploy_key docker-compose.prod.yml "$TARGET:$DEPLOY_PATH/docker-compose.yml"
      - name: Pull and restart
        # The job token is piped to `docker login` and only lives as long as
        # this job, so the server never stores a registry credential.
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/ride-board' }}
          RIDE_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key "$TARGET" \
            "set -e
             cd '$DEPLOY_PATH'
             docker login ghcr.io -u '$REGISTRY_USER' --password-stdin
             export RIDE_IMAGE='$RIDE_IMAGE'
             docker compose pull
             docker compose up -d
             docker logout ghcr.io
             docker image prune -af
             sleep 5
             curl -fsS -o /dev/null -w 'ride responded %{http_code}\n' \"http://\$(docker compose port ride 3000)/ride\""
