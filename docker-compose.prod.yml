# Server-side compose file: runs the prebuilt image (see DEPLOYMENT.md).
# RIDE_IMAGE is set by the GitHub Actions deploy; for a manual deploy from
# your Mac, run `RIDE_IMAGE=ride-board:latest docker compose up -d`.
services:
  ride:
    image: ${RIDE_IMAGE:-ghcr.io/mclaughlin111/ride-page:latest}
    container_name: ride-board
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3020}:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATA_FILE_PATH=/app/data/rides.json
      - NEXT_PUBLIC_BASE_PATH=/ride
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      - SESSION_SECRET=${SESSION_SECRET:?Set SESSION_SECRET in .env}
    volumes:
      - ride-data:/app/data

volumes:
  ride-data:
